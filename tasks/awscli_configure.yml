---
- name: Retrieve user information from passwd database
  ansible.builtin.getent:
    database: passwd
    key: "{{ __awscli_user }}"
    split: ":"
  register: __awscli_passwd

- name: Set user home directory path
  ansible.builtin.set_fact:
    __awscli_homepath: "{{ __awscli_passwd.ansible_facts.getent_passwd[__awscli_user][4] }}"

- name: Create AWS configuration directory
  become: true
  ansible.builtin.file:
    path: "{{ __awscli_homepath }}/.aws"
    state: directory
    owner: "{{ __awscli_user }}"
    group: "{{ __awscli_user }}"
    mode: "0700"

- name: Create AWS credentials file from template
  become: true
  ansible.builtin.template:
    src: credentials.j2
    dest: "{{ __awscli_homepath }}/.aws/credentials"
    owner: "{{ __awscli_user }}"
    group: "{{ __awscli_user }}"
    mode: "0600"
  no_log: true
  diff: false

- name: Create AWS config file from template
  become: true
  ansible.builtin.template:
    src: config.j2
    dest: "{{ __awscli_homepath }}/.aws/config"
    owner: "{{ __awscli_user }}"
    group: "{{ __awscli_user }}"
    mode: "0600"
  no_log: true
  diff: false
